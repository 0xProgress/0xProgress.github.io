name: Build Site Data

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Fetch repository list
        run: |
          gh api users/0xProgress/repos --paginate --jq '.[] | select(.fork == false) | {name: .name, description: .description, html_url: .html_url, topics: .topics, language: .language, updated_at: .updated_at}' > repos.json

      - name: Compute total commits
        run: |
          TOTAL=0
          for repo in $(jq -r '.name' repos.json); do
            echo "Counting commits for $repo..."
            contrib=$(gh api repos/0xProgress/$repo/contributors --jq '.[] | select(.login=="0xProgress") | .contributions' 2>/dev/null || echo 0)
            TOTAL=$((TOTAL + contrib))
            echo "  Found $contrib commits"
          done
          echo "TOTAL_COMMITS=$TOTAL" >> $GITHUB_ENV
          echo "Total commits across all repos: $TOTAL"

      - name: Fetch PR and issue counts
        run: |
          PRS=$(gh api "search/issues?q=author:0xProgress+is:pr&per_page=1" --jq '.total_count' 2>/dev/null || echo 0)
          ISSUES=$(gh api "search/issues?q=author:0xProgress+is:issue&per_page=1" --jq '.total_count' 2>/dev/null || echo 0)
          echo "PRS=$PRS" >> $GITHUB_ENV
          echo "ISSUES=$ISSUES" >> $GITHUB_ENV
          echo "PRs: $PRS, Issues: $ISSUES"

      - name: Fetch languages for each repo
        run: |
          echo '{}' > languages.json
          for repo in $(jq -r '.name' repos.json); do
            echo "Fetching languages for $repo..."
            langs=$(gh api repos/0xProgress/$repo/languages --jq 'keys' 2>/dev/null || echo '[]')
            jq --arg repo "$repo" --argjson langs "$langs" '. + {($repo): $langs}' languages.json > tmp && mv tmp languages.json
          done

      - name: Fetch recent commit events
        run: |
          gh api users/0xProgress/events/public?per_page=20 --jq '.[] | select(.type=="PushEvent" and .created_at != null) | {repo: .repo.name, sha: .payload.head, created_at: .created_at}' > events.json

          echo '[]' > commits.json
          while read -r event; do
            repo=$(echo "$event" | jq -r '.repo')
            sha=$(echo "$event" | jq -r '.sha')
            date=$(echo "$event" | jq -r '.created_at')
            
            # Only fetch commit message if SHA exists and is not null
            if [ -n "$sha" ] && [ "$sha" != "null" ]; then
              msg=$(gh api repos/$repo/commits/$sha --jq '.commit.message | split("\n")[0]' 2>/dev/null || echo "")
              if [ -n "$msg" ] && [ "$msg" != "null" ]; then
                jq --arg repo "$repo" --arg sha "$sha" --arg date "$date" --arg msg "$msg" \
                  '. + [{repo: $repo, sha: $sha, date: $date, message: $msg}]' commits.json > tmp && mv tmp commits.json
              fi
            fi
          done < <(jq -c '.' events.json)

          jq '.[:6]' commits.json > recent_commits.json

      - name: Build final site-data.json
        run: |
          jq -s '{projects: ., commits: [], totalCommits: $ENV.TOTAL_COMMITS, currentFocus: "Golang"}' repos.json > site-data.json

          jq --arg prs "$PRS" --arg issues "$ISSUES" '.totalPRs = $prs | .totalIssues = $issues' site-data.json > tmp && mv tmp site-data.json

          jq --slurpfile commits recent_commits.json '.commits = $commits[0]' site-data.json > tmp && mv tmp site-data.json

          jq --arg date "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" '.updatedAt = $date' site-data.json > tmp && mv tmp site-data.json

          for repo in $(jq -r '.projects[].name' site-data.json); do
            langs=$(jq --arg repo "$repo" '.[$repo] // []' languages.json)
            jq --arg repo "$repo" --argjson langs "$langs" \
              '.projects |= map(if .name == $repo then . + {tech: $langs} else . end)' site-data.json > tmp && mv tmp site-data.json
          done

          jq '.projects |= map(. + {tech: (if .tech and (.tech | length) > 0 then .tech else [.language] | map(select(. != null and . != "null")) end)})' site-data.json > tmp && mv tmp site-data.json

          jq '.projects |= map(. + {status: (if (now - (.updatedAt | fromdate)) < 2592000 then "Active" elif (now - (.updatedAt | fromdate)) < 7776000 then "Maintenance" else "Stable" end)})' site-data.json > tmp && mv tmp site-data.json

          jq '.projects |= map(select(.description != null and .description != "" and .description != ":root repo"))' site-data.json > tmp && mv tmp site-data.json

          jq '.projects |= map(. + {repoUrl: .html_url})' site-data.json > tmp && mv tmp site-data.json

          jq '.commits |= map({
            username: "0xProgress",
            repo: (.repo | split("/")[1]),
            message: .message,
            date: (if .date and .date != "" and .date != null then (.date | split("T")[0] | strptime("%Y-%m-%d") | strftime("%b %d")) else "" end)
          })' site-data.json > tmp && mv tmp site-data.json

          if [ "$(jq '.commits | length' site-data.json)" -eq 0 ]; then
            jq '.commits = [{
              username: "0xProgress",
              repo: "0xProgress",
              message: "No recent commits — building something soon.",
              date: ""
            }]' site-data.json > tmp && mv tmp site-data.json
          fi

      - name: Create data directory
        run: mkdir -p data

      - name: Move site-data.json to data
        run: mv site-data.json data/site-data.json

      - name: Commit and push
        run: |
          git config user.name "0xProgress"
          git config user.email "progressuwhuseba@gmail.com"
          git add data/site-data.json
          git diff --staged --quiet || git commit -m "Automatic update for site data [skip ci]"
          git push
