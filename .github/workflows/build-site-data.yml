name: Build Site Data

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: build-site-data
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.PAT_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Verify token sees private repos
        run: |
          set -euo pipefail
          echo "Authenticated as: $(gh api user --jq '.login')"
          n=$(gh api "user/repos?visibility=private&affiliation=owner" --jq 'length')
          echo "Private repos visible: $n"
          if [ "$n" -eq 0 ]; then
            echo "::error::PAT_TOKEN cannot see private repos. Check its Repository access is 'All repositories'."
            exit 1
          fi

      - name: Fetch repository list
        run: |
          set -euo pipefail
          gh api "user/repos?visibility=all&affiliation=owner&per_page=100" --paginate \
            --jq '.[]
                  | select(.fork == false)
                  | select(.archived == false)
                  | select(.name != "0xprogress.pages.dev")
                  | select(.name != "0xProgress")
                  | select(.description != ":root repo")
                  | {
                      name: .name,
                      description: .description,
                      html_url: .html_url,
                      topics: .topics,
                      language: .language,
                      private: .private,
                      updated_at: .updated_at
                    }' > repos.ndjson

          jq -s 'sort_by(.updated_at) | reverse' repos.ndjson > repos.json

          total=$(jq 'length' repos.json)
          priv=$(jq '[.[] | select(.private)] | length' repos.json)
          echo "Repos: $total (private: $priv, public: $((total - priv)))"

          if [ "$total" -eq 0 ]; then
            echo "::error::No repos returned."
            exit 1
          fi

      - name: Compute total commits
        run: |
          set -euo pipefail
          TOTAL=0
          for repo in $(jq -r '.[].name' repos.json); do
            contrib=$(gh api "repos/0xProgress/$repo/contributors?per_page=100&anon=false" \
              --jq '.[] | select(.login == "0xProgress") | .contributions' 2>/dev/null || true)
            contrib=${contrib:-0}
            TOTAL=$((TOTAL + contrib))
            printf '  %-30s %s\n' "$repo" "$contrib"
          done
          echo "TOTAL_COMMITS=$TOTAL" >> "$GITHUB_ENV"
          echo "Total: $TOTAL"

      - name: Fetch PR and issue counts
        run: |
          set -euo pipefail
          PRS=$(gh api "search/issues?q=author:0xProgress+is:pr&per_page=1" --jq '.total_count' 2>/dev/null || echo 0)
          ISSUES=$(gh api "search/issues?q=author:0xProgress+is:issue&per_page=1" --jq '.total_count' 2>/dev/null || echo 0)
          echo "PRS=$PRS" >> "$GITHUB_ENV"
          echo "ISSUES=$ISSUES" >> "$GITHUB_ENV"
          echo "PRs: $PRS  Issues: $ISSUES"

      - name: Fetch languages per repo
        run: |
          set -euo pipefail
          echo '{}' > languages.json
          for repo in $(jq -r '.[].name' repos.json); do
            langs=$(gh api "repos/0xProgress/$repo/languages" --jq 'keys' 2>/dev/null || echo '[]')
            jq --arg repo "$repo" --argjson langs "$langs" \
              '. + {($repo): $langs}' languages.json > tmp && mv tmp languages.json
          done

      - name: Fetch latest commit per repo
        run: |
          set -euo pipefail
          echo '[]' > all_latest_commits.json
          for repo in $(jq -r '.[].name' repos.json); do
            data=$(gh api "repos/0xProgress/$repo/commits?per_page=1" 2>/dev/null || echo "[]")
            valid=$(echo "$data" | jq 'if type == "array" and length > 0 then .[0] else null end' 2>/dev/null || echo null)
            if [ "$valid" != "null" ] && [ -n "$valid" ]; then
              sha=$(echo "$valid" | jq -r '.sha')
              date=$(echo "$valid" | jq -r '.commit.committer.date')
              msg=$(echo "$valid" | jq -r '.commit.message | split("\n")[0]')
              jq --arg repo "$repo" --arg sha "$sha" --arg date "$date" --arg msg "$msg" \
                '. + [{repo: $repo, sha: $sha, date: $date, message: $msg}]' \
                all_latest_commits.json > tmp && mv tmp all_latest_commits.json
            fi
          done

          jq '[ .[]
                | select(.message | test("\\[skip ci\\]|Automatic update|^chore: auto-update"; "i") | not)
              ]
              | sort_by(.date) | reverse | .[:8]' \
            all_latest_commits.json > recent_commits.json

      - name: Build data/site-data.json
        run: |
          set -euo pipefail
          mkdir -p data

          jq -n \
            --slurpfile projects repos.json \
            --slurpfile commits recent_commits.json \
            --arg total "$TOTAL_COMMITS" \
            --arg prs "$PRS" \
            --arg issues "$ISSUES" \
            --arg now "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            '{
              projects: $projects[0],
              commits: $commits[0],
              totalCommits: ($total | tonumber? // 0),
              totalPRs:     ($prs   | tonumber? // 0),
              totalIssues:  ($issues| tonumber? // 0),
              currentFocus: "Golang",
              updatedAt:    $now
            }' > data/site-data.json

          for repo in $(jq -r '.projects[].name' data/site-data.json); do
            langs=$(jq --arg repo "$repo" '.[$repo] // []' languages.json)
            jq --arg repo "$repo" --argjson langs "$langs" \
              '.projects |= map(if .name == $repo then . + {tech: $langs} else . end)' \
              data/site-data.json > tmp && mv tmp data/site-data.json
          done

          jq '
            .projects |= map(
              . + {
                tech: (if (.tech // []) | length > 0
                       then .tech
                       else ([.language] | map(select(. != null and . != "null")))
                       end)
              }
              | . + {
                status: (
                  try (
                    if (now - (.updated_at | fromdate)) < 2592000 then "Active"
                    elif (now - (.updated_at | fromdate)) < 7776000 then "Maintenance"
                    else "Stable"
                    end
                  ) catch "Stable"
                )
              }
              | . + {
                displayName: (
                  .name
                  | gsub("-"; " ") | gsub("_"; " ")
                  | split(" ")
                  | map(if length > 0 then (.[0:1] | ascii_upcase) + .[1:] else . end)
                  | join(" ")
                )
              }
              | . + { repoUrl: .html_url }
            )
            | .projects |= map(select(.description != null and .description != ""))
          ' data/site-data.json > tmp && mv tmp data/site-data.json

          jq '
            .commits |= map({
              username: "0xProgress",
              repo: (.repo // "unknown"),
              sha: (.sha // ""),
              message: (.message // "No message"),
              date: (try (.date | split("T")[0] | strptime("%Y-%m-%d") | strftime("%b %d")) catch "")
            })
          ' data/site-data.json > tmp && mv tmp data/site-data.json

          if [ "$(jq '.commits | length' data/site-data.json)" -eq 0 ]; then
            jq '.commits = [{
              username: "0xProgress",
              repo: "0xProgress",
              sha: "",
              message: "Building something soon.",
              date: ""
            }]' data/site-data.json > tmp && mv tmp data/site-data.json
          fi

      - name: Regenerate sitemap.xml
        run: |
          set -euo pipefail
          TODAY=$(date -u +'%Y-%m-%d')
          cat > sitemap.xml <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
            <url>
              <loc>https://0xprogress.pages.dev</loc>
              <lastmod>${TODAY}</lastmod>
              <changefreq>weekly</changefreq>
              <priority>1.0</priority>
            </url>
          </urlset>
          EOF
          xmllint --noout sitemap.xml 2>/dev/null || python3 -c "import xml.dom.minidom; xml.dom.minidom.parse('sitemap.xml')"

      - name: Ensure .nojekyll and robots.txt
        run: |
          set -euo pipefail
          touch .nojekyll
          if [ ! -f robots.txt ]; then
            cat > robots.txt <<'EOF'
          User-agent: *
          Allow: /

          Sitemap: https://0xprogress.pages.dev/sitemap.xml
          EOF
          fi

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "0xProgress"
          git config user.email "progressuwhuseba@gmail.com"
          git add data/site-data.json sitemap.xml .nojekyll robots.txt
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "chore: auto-update site data + sitemap [skip ci]"
            git push
          fi
